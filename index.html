<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoidScans — Free Manhwa Translations</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar glass">
      <div class="nav-inner">
      <div class="nav-logo">VOID<span>SCANS</span></div>
      <div class="nav-links">
        <a href="#" class="nav-link active">Home</a>
        <a href="#" class="nav-link">Browse</a>
      </div>
    </div>
  </nav>

  <section class="section" id="latest">
    <div class="container">
      <div class="section-header">
        <h2 class="section-title">Latest Updates</h2>
      </div>
      <div class="update-list" id="dynamic-updates-list">
        <p style="color: var(--text-muted);">Loading latest chapters from the void...</p>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-header">
        <h2 class="section-title">Popular Series</h2>
      </div>
      <div class="card-grid" id="dynamic-series-grid">
      </div>
    </div>
  </section>

  <script type="module">
    import { db } from './firebase.js';
    import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // XSS SECURITY GATE: This strips executable code out of database strings
    const escapeHTML = (str) => {
      if (str === null || str === undefined) return '';
      return String(str).replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag] || tag));
    };

    async function loadSiteData() {
      const grid = document.getElementById('dynamic-series-grid');
      const updateList = document.getElementById('dynamic-updates-list');
      grid.innerHTML = ''; 
      updateList.innerHTML = '';

      try {
        const q = query(collection(db, "series"), orderBy("createdAt", "desc"));
        const querySnapshot = await getDocs(q);

        querySnapshot.forEach((doc) => {
          const series = doc.data();
          
          // 1. Sanitize all incoming data
          const safeTitle = escapeHTML(series.title);
          const safeCover = escapeHTML(series.cover);
          const safeStatus = escapeHTML(series.status);
          const safeType = escapeHTML(series.type);
          const safeSlug = escapeHTML(series.slug);
          const safeChapter = escapeHTML(series.latestChapter);

          // 2. Build Grid Cards (ADDED: glass-panel class to the card)
          const cardHTML = `
            <div class="card glass-panel" onclick="window.location.href='https://voidscans.neocities.org/reader.html?series=${safeSlug}&ch=${safeChapter}'">
              <div class="card-img-wrap">
                <img src="${safeCover}" class="card-img" alt="${safeTitle}">
                <div class="card-badge badge-ongoing">${safeStatus}</div>
                <div class="card-chapter">Ch. ${safeChapter}</div>
              </div>
              <div class="card-info">
                <div class="card-title">${safeTitle}</div>
                <div class="card-type">${safeType}</div>
              </div>
            </div>
          `;
          grid.innerHTML += cardHTML;

          // 3. Build Latest Updates (ADDED: glass-panel class to the item)
          if(series.latestChapter > 0) {
            const updateHTML = `
              <div class="update-item glass-panel" style="margin-bottom: 8px;" onclick="window.location.href='https://voidscans.neocities.org/reader.html?series=${safeSlug}&ch=${safeChapter}'">
                <img class="update-thumb" src="${safeCover}" alt="${safeTitle}">
                <div class="update-meta">
                  <div class="update-title">${safeTitle}</div>
                  <div class="update-chapters">
                    <span class="update-ch-link">Ch. ${safeChapter}</span>
                  </div>
                </div>
              </div>
            `;
            updateList.innerHTML += updateHTML;
          }
        });
      } catch (error) {
        console.error("Database Error:", error);
        grid.innerHTML = '<p>Failed to connect to database.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadSiteData);
  </script>
</body>
</html>
