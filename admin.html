<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VoidScans Admin Panel</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container { max-width: 800px; margin: 40px auto; background: var(--surface); padding: 30px; border-radius: var(--r-md); border: 1px solid var(--border); }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; color: var(--text-soft); font-size: 0.9rem; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: var(--r-sm); }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .tab-btn { padding: 10px 20px; cursor: pointer; color: var(--text-muted); font-weight: 600; background: none; border: none; font-size: 1rem; }
    .tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .btn { padding: 10px 20px; border: none; border-radius: var(--r-sm); cursor: pointer; font-weight: bold; background: var(--surface-2); color: var(--text); }
    .btn-primary { background: var(--accent); color: #fff; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <div class="nav-logo">VOID<span>ADMIN</span></div>
      <div style="display: flex; gap: 15px; align-items: center;">
        <a href="index.html" class="nav-link" target="_blank">View Live Site ↗</a>
        <button id="logout-btn" class="btn" style="display: none; padding: 5px 15px;">Logout</button>
      </div>
    </div>
  </nav>

  <div id="login-section" class="admin-container fade-up">
    <h2 style="margin-bottom: 20px;">Admin Login</h2>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="admin-email" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="admin-password" required>
    </div>
    <button id="login-btn" class="btn btn-primary">Login</button>
    <p id="login-error" style="color: #ff4d4d; display: none; margin-top: 15px; font-weight: bold;">Invalid credentials.</p>
  </div>

  <div id="admin-section" class="admin-container fade-up" style="display: none;">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('add-series', event)">📘 Add New Series</button>
      <button class="tab-btn" onclick="switchTab('add-chapter', event)">📄 Add New Chapter</button>
    </div>

    <div id="add-series" class="tab-content active">
      <h2>Publish New Manhwa</h2>
      <form id="series-form">
        <div class="form-group">
          <label>Series Title</label>
          <input type="text" id="s-title" required>
        </div>
        <div class="form-group">
          <label>URL Slug (no spaces, e.g. solo-raven)</label>
          <input type="text" id="s-slug" required>
        </div>
        <div class="form-group">
          <label>Cover Image URL (Catbox/R2)</label>
          <input type="url" id="s-cover" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="s-desc" rows="4" required></textarea>
        </div>
        <div class="form-group" style="display: flex; gap: 10px;">
          <div style="flex: 1;"><label>Type</label><select id="s-type"><option>Manhwa</option><option>Manga</option></select></div>
          <div style="flex: 1;"><label>Status</label><select id="s-status"><option>Ongoing</option><option>Completed</option></select></div>
        </div>
        <button type="submit" class="btn btn-primary">Publish Series</button>
      </form>
    </div>

    <div id="add-chapter" class="tab-content">
      <h2>Upload New Chapter</h2>
      <form id="chapter-form">
        <div class="form-group">
          <label>Series Slug (e.g. solo-raven)</label>
          <input type="text" id="c-series-slug" required>
        </div>
        <div class="form-group">
          <label>Chapter Number</label>
          <input type="number" id="c-num" required>
        </div>
        <div class="form-group">
          <label>Image URLs (Paste Catbox/Imgbb links here, one per line)</label>
          <textarea id="c-images" rows="10" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Publish Chapter</button>
      </form>
    </div>

    <section class="section glass" style="margin-top: 40px; padding: 20px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--border);">
      <div class="section-header" style="margin-bottom: 15px;">
        <h2 class="section-title">Database Management</h2>
      </div>
      <div id="admin-series-list" style="display: flex; flex-direction: column; gap: 8px;">
        <p style="color: var(--text-muted);">Fetching database records...</p>
      </div>
    </section>
  </div>

  <script type="module">
    import { db, auth } from './firebase.js'; 
    import { collection, addDoc, serverTimestamp, query, where, getDocs, orderBy, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Tab Switching Logic
    window.switchTab = function(tabId, event) {
      document.querySelectorAll('.tab-content, .tab-btn').forEach(t => t.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      if (event && event.currentTarget) {
        event.currentTarget.classList.add('active');
      }
    };

    // DOM Elements for Auth
    const loginSection = document.getElementById('login-section');
    const adminSection = document.getElementById('admin-section');
    const logoutBtn = document.getElementById('logout-btn');
    const loginBtn = document.getElementById('login-btn');
    const errorMsg = document.getElementById('login-error');

    // 1. Listen for Login Status (The Gatekeeper)
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginSection.style.display = 'none';
        adminSection.style.display = 'block';
        logoutBtn.style.display = 'block';
        loadAdminSeries(); // Automatically reload records when logged in
      } else {
        loginSection.style.display = 'block';
        adminSection.style.display = 'none';
        logoutBtn.style.display = 'none';
      }
    });

    // 2. Handle Login Button Click
    loginBtn.addEventListener('click', () => {
      const email = document.getElementById('admin-email').value;
      const password = document.getElementById('admin-password').value;
      
      signInWithEmailAndPassword(auth, email, password)
        .then(() => {
          errorMsg.style.display = 'none';
          document.getElementById('admin-email').value = '';
          document.getElementById('admin-password').value = '';
        })
        .catch((error) => {
          errorMsg.style.display = 'block';
          console.error("Login failed:", error);
        });
    });

    // 3. Handle Logout Button Click
    logoutBtn.addEventListener('click', () => {
      signOut(auth);
    });

    // 4. Series Form Submission
    document.getElementById('series-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await addDoc(collection(db, "series"), {
          title: document.getElementById('s-title').value,
          slug: document.getElementById('s-slug').value.trim(),
          cover: document.getElementById('s-cover').value.trim(),
          description: document.getElementById('s-desc').value,
          type: document.getElementById('s-type').value,
          status: document.getElementById('s-status').value,
          latestChapter: 0,
          createdAt: serverTimestamp()
        });
        alert("Series published successfully!"); 
        e.target.reset();
        loadAdminSeries(); // Refresh records list
      } catch (error) { 
        alert("Failed to publish series.");
        console.error(error);
      }
    });

    // 5. Chapter Form Submission (With Auto-Update Logic)
    document.getElementById('chapter-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const targetSlug = document.getElementById('c-series-slug').value.trim();
      const chapterNumber = Number(document.getElementById('c-num').value);
      const rawImages = document.getElementById('c-images').value;
      const imageUrls = rawImages.split('\n').map(url => url.trim()).filter(url => url !== "");
      
      try {
        // A. Upload the new chapter to the database
        await addDoc(collection(db, "chapters"), {
          seriesSlug: targetSlug,
          chapterNum: chapterNumber,
          images: imageUrls,
          createdAt: serverTimestamp()
        });

        // B. Find the matching Series and update its "Latest Chapter"
        const q = query(collection(db, "series"), where("slug", "==", targetSlug));
        const querySnapshot = await getDocs(q);
        
        if (!querySnapshot.empty) {
          const seriesDoc = querySnapshot.docs[0]; 
          const currentLatest = seriesDoc.data().latestChapter || 0;
          
          if (chapterNumber > currentLatest) {
            await updateDoc(seriesDoc.ref, {
              latestChapter: chapterNumber,
              createdAt: serverTimestamp() 
            });
          }
        }

        alert(`Chapter ${chapterNumber} published and series updated!`); 
        e.target.reset();
      } catch (error) { 
        alert("Failed to publish chapter.");
        console.error(error);
      }
    });

    // ==========================================
    // PHASE 3: DATABASE MANAGEMENT ENGINE
    // ==========================================
    
    // 1. The XSS Sanitizer
    const escapeHTML = (str) => {
      if (!str) return '';
      return String(str).replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    };

    // 2. Fetch and Display the Records
    async function loadAdminSeries() {
      const list = document.getElementById('admin-series-list');
      if (!list) return;

      let htmlString = ''; 
      
      try {
        const q = query(collection(db, "series"), orderBy("createdAt", "desc"));
        const snapshot = await getDocs(q);
        
        if(snapshot.empty) {
          list.innerHTML = '<p style="color: var(--text-muted);">No records found in database.</p>';
          return;
        }

        snapshot.forEach((document) => {
          const data = document.data();
          const docId = document.id;
          const safeSlug = escapeHTML(data.slug);
          const safeTitle = escapeHTML(data.title);
          
          htmlString += `
            <div style="display: flex; align-items: center; justify-content: space-between; background: var(--surface); padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--r-sm); margin-bottom: 8px;">
              <div>
                <strong style="color: var(--text);">${safeTitle}</strong> 
                <span style="color: var(--text-muted); font-size: 0.85rem; margin-left: 8px;">(/${safeSlug})</span>
              </div>
              <button class="btn btn-sm" style="background: #ff4d4d; color: white;" onclick="deleteRecord('${docId}', '${safeTitle}', '${safeSlug}')">
                Delete Record
              </button>
            </div>
          `;
        });
        
        list.innerHTML = htmlString;
      } catch (error) {
        console.error("Failed to fetch records:", error);
      }
    }

    // 3. The Cascading Delete Function
    window.deleteRecord = async (docId, title, slug) => {
      if(confirm(`WARNING: Are you sure you want to drop "${title}" AND all its chapters? This is permanent.`)) {
        try {
          // A. Hunt down and delete all child chapters first
          const chaptersQuery = query(collection(db, "chapters"), where("seriesSlug", "==", slug));
          const chaptersSnapshot = await getDocs(chaptersQuery);
          
          const deletePromises = [];
          chaptersSnapshot.forEach((chDoc) => {
            deletePromises.push(deleteDoc(doc(db, "chapters", chDoc.id)));
          });
          await Promise.all(deletePromises);

          // B. Delete the main parent series document
          await deleteDoc(doc(db, "series", docId));
          
          alert(`Successfully deleted "${title}" and ${deletePromises.length} associated chapters.`);
          loadAdminSeries(); 
        } catch (error) {
          console.error("Execution failed:", error);
          alert("Critical error: Failed to drop records.");
        }
      }
    };
  </script>
</body>
</html>
