<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoidScans Reader</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Reader-Specific Styles */
    .reader-wrapper {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 15px;
    }
    .reader-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .reader-title {
      font-family: var(--font-head);
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 10px;
      text-transform: capitalize;
    }
    .reader-nav-btns {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 20px 0;
    }
    /* Removes all gaps between images for seamless scrolling */
    .manga-image-container {
      display: flex;
      flex-direction: column;
      background: var(--bg-deep);
    }
    .manga-page {
      width: 100%;
      height: auto;
      display: block;
      margin: 0;
      padding: 0;
    }
    .loading-text {
      text-align: center;
      color: var(--text-muted);
      font-size: 1.2rem;
      padding: 50px 0;
    }
  </style>
</head>
<body>

  <nav class="navbar glass">
    <div class="nav-inner">
      <div class="nav-logo">VOID<span>SCANS</span></div>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="index.html#popular" class="nav-link">Popular Series</a>
      </div>
    </div>
  </nav>

  <div class="reader-wrapper">
    <div class="reader-header glass" style="padding: 20px; border-radius: var(--r-md);">
      <h1 class="reader-title" id="display-title">Loading...</h1>
      <p style="color: var(--text-soft);" id="display-chapter">Chapter --</p>
    </div>

    <div class="reader-nav-btns">
      <button class="btn btn-outline" id="prev-btn" style="visibility: hidden;">&larr; Previous</button>
      <button class="btn btn-outline" id="next-btn" style="visibility: hidden;">Next &rarr;</button>
    </div>

    <div class="manga-image-container" id="image-canvas">
      <div class="loading-text" id="loading-msg">Connecting to the void...</div>
    </div>

    <div class="reader-nav-btns">
      <button class="btn btn-outline" id="prev-btn-bot" style="visibility: hidden;">&larr; Previous</button>
      <button class="btn btn-outline" id="next-btn-bot" style="visibility: hidden;">Next &rarr;</button>
    </div>
  </div>

  <script type="module">
    import { db } from './firebase.js';
    // Notice we import 'where' so we can search the database for a specific chapter
    import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. Grab the URL parameters (e.g., ?series=solo-raven&ch=1)
    const urlParams = new URLSearchParams(window.location.search);
    const currentSeries = urlParams.get('series');
    const currentChapter = Number(urlParams.get('ch'));

    // DOM Elements
    const canvas = document.getElementById('image-canvas');
    const loadingMsg = document.getElementById('loading-msg');
    const titleText = document.getElementById('display-title');
    const chapterText = document.getElementById('display-chapter');
    const nextBtns = [document.getElementById('next-btn'), document.getElementById('next-btn-bot')];
    const prevBtns = [document.getElementById('prev-btn'), document.getElementById('prev-btn-bot')];

    async function loadChapter() {
      if (!currentSeries || !currentChapter) {
        loadingMsg.innerHTML = "Error: Invalid URL. No series or chapter specified.";
        titleText.innerText = "Error";
        return;
      }

      // Format title for display (turns "solo-raven" into "Solo Raven")
      titleText.innerText = currentSeries.replace(/-/g, ' ');
      chapterText.innerText = `Chapter ${currentChapter}`;

      try {
        // 2. Ask Firebase for the exact chapter document
        const q = query(
          collection(db, "chapters"), 
          where("seriesSlug", "==", currentSeries),
          where("chapterNum", "==", currentChapter)
        );
        
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          loadingMsg.innerHTML = "Chapter not found. It may have been deleted or not uploaded yet.";
          return;
        }

        // 3. Inject the images onto the screen
        querySnapshot.forEach((doc) => {
          const chapterData = doc.data();
          const imageUrls = chapterData.images;
          
          canvas.innerHTML = ''; // Clear loading message

          imageUrls.forEach(url => {
            // Build safe image tags and drop them in the canvas
            const img = document.createElement('img');
            img.src = url;
            img.className = 'manga-page';
            img.loading = 'lazy'; // Makes the page load faster by delaying off-screen images
            canvas.appendChild(img);
          });
        });

        // 4. Set up Next/Prev Buttons
        if (currentChapter > 1) {
          prevBtns.forEach(btn => {
            btn.style.visibility = 'visible';
            btn.onclick = () => window.location.href = `reader.html?series=${currentSeries}&ch=${currentChapter - 1}`;
          });
        }
        
        // We always show the Next button for now. (Advanced logic would check the DB if ch+1 exists)
        nextBtns.forEach(btn => {
          btn.style.visibility = 'visible';
          btn.onclick = () => window.location.href = `reader.html?series=${currentSeries}&ch=${currentChapter + 1}`;
        });

      } catch (error) {
        console.error("Database Error:", error);
        loadingMsg.innerHTML = "Error connecting to the database.";
      }
    }

    // Run the engine when the page loads
    document.addEventListener('DOMContentLoaded', loadChapter);
  </script>
</body>
</html>
